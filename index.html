  <h1>Driver Route Sheet</h1>
  <div class="sub" id="dateLbl"></div>
  <div class="bar" id="listBar">
    <div class="dnav"><button type="button" id="dPrev" aria-label="Previous day">‹</button><select id="day" aria-label="Day"></select><button type="button" id="dNext" aria-label="Next day">›</button></div>

<div id="upCorner"><button type="button" id="upBtn" aria-label="Upload PDF"><b>&#8593;</b>UPLOAD<br>PDF</button><input type="file" id="upFile" accept="application/pdf,.pdf" multiple hidden></div><div id="upMsg" role="status"></div>
<script>
(()=>{const FN='https://ksuvjhutalvwgikvsdeu.supabase.co/functions/v1/upload-sheet',KEY='sb_publishable_v60aHIwkGcr_a9UvWTb9jA_7qcffk8B';
const btn=document.getElementById('upBtn'),inp=document.getElementById('upFile'),msg=document.getElementById('upMsg');let hideT;
const say=(t,ms)=>{msg.textContent=t;msg.style.display='block';clearTimeout(hideT);if(ms)hideT=setTimeout(()=>msg.style.display='none',ms)};
const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});
const stamp=async()=>{try{const r=await fetch('data/latest.json?t='+Date.now(),{cache:'no-store'});return (await r.json()).updated||''}catch(e){return ''}};
btn.onclick=()=>inp.click();
inp.onchange=async()=>{const fs=[...inp.files];inp.value='';if(!fs.length)return;
  if(fs.some(f=>!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'))return say('Pick PDF files only (the Deputy driver list / pick sheet).',5000);
  if(fs.length>4)return say('Up to 4 PDFs at a time.',5000);
  btn.disabled=true;say('Uploading '+fs.length+' PDF'+(fs.length>1?'s':'')+'…');
  try{const before=await stamp();const files=await Promise.all(fs.map(async f=>({name:f.name,b64:await b64(f)})));
    const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},body:JSON.stringify({files})});
    const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||('error '+r.status));
    say('Uploaded ✓ Reading the PDFs — the board will refresh by itself in about 2 minutes.');
    let n=0;const iv=setInterval(async()=>{n++;const now=await stamp();if(now&&now!==before){clearInterval(iv);say('Board updated ✓ Reloading…');setTimeout(()=>location.reload(),1200)}else if(n>=30){clearInterval(iv);say('Uploaded, but the board hasn\'t changed yet. Pull down to refresh in a few minutes.',8000)}},12000);
  }catch(e){say('Upload failed: '+e.message,8000)}finally{btn.disabled=false}};

  var bytes=new Uint8Array(r.pdf.length);for(var i=0;i<r.pdf.length;i++)bytes[i]=r.pdf.charCodeAt(i)&255;
  return {blob:new Blob([bytes],{type:'application/pdf'}),rows:R,label:(DAYS[day].label||day).split(' · ')[0]}};

<script>
(()=>{const b=document.getElementById('qrBtn'),sh=document.getElementById('qrShade'),big=document.getElementById('qrBig');let open=false,busy=false;
function place(){const r=b.getBoundingClientRect();big.style.left=r.left+'px';big.style.top=r.top+'px';big.style.width=r.width+'px';big.style.height=r.height+'px';return r}
function target(r){const s=Math.min(innerWidth,innerHeight)*0.94,k=s/r.width;return 'translate('+((innerWidth-s)/2-r.left)+'px,'+((innerHeight-s)/2-r.top)+'px) scale('+k+')'}
b.onclick=e=>{e.stopPropagation();if(open||busy)return;busy=true;const r=place();big.style.transition='none';big.style.transform='none';big.style.display='block';b.style.visibility='hidden';sh.style.pointerEvents='auto';big.offsetWidth;
big.style.transition='transform 1.5s cubic-bezier(.4,0,.2,1)';sh.style.transition='opacity 1.5s ease';big.style.transform=target(r);sh.style.opacity='1';setTimeout(()=>{open=true;busy=false},1500)};
function close(){if(!open||busy)return;busy=true;place();big.style.transition='transform .5s cubic-bezier(.4,0,.2,1)';sh.style.transition='opacity .5s ease';big.style.transform='none';sh.style.opacity='0';
setTimeout(()=>{big.style.display='none';b.style.visibility='';sh.style.pointerEvents='none';open=false;busy=false},500)}
sh.onclick=close;big.onclick=close;addEventListener('resize',()=>{if(open){big.style.transition='none';big.style.transform=target(place())}})})();
</script>
