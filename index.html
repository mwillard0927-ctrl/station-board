<title>Station Driver Board</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--acc:#ff9900;--dark:#232f3e;
--g1:#DC2626;--g2:#CA8A04;--g3:#16A34A;--g4:#2563EB;--g5:#7C3AED;--g0:#6b7280}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#1a212b;--ink:#f3f4f6;--mute:#9ca3af;--line:#2b3440;--dark:#0b0f14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#1a212b;--ink:#f3f4f6;--mute:#9ca3af;--line:#2b3440;--dark:#0b0f14;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--dark);color:#fff;padding:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{margin:0;font-size:20px}
header .sub{font-variant-numeric:tabular-nums;color:var(--acc);font-weight:600;font-size:14px;margin-top:2px}
.bar{display:flex;gap:8px;margin-top:10px}
select,input[type=search]{flex:1;padding:10px;border-radius:10px;border:0;font-size:16px}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.head,.row{display:grid;grid-template-columns:44px 1.6fr .8fr .8fr 1fr;gap:6px;align-items:center}
.head{font-size:11px;text-transform:uppercase;color:var(--mute);font-weight:700;padding:8px 10px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:6px;font-size:15px}
.row a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--acc)}
.grp{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800}
.g1{background:var(--g1)}.g2{background:var(--g2)}.g3{background:var(--g3)}.g4{background:var(--g4)}.g5{background:var(--g5)}.g0{background:var(--g0);font-size:11px}
.stg{font-size:11px;color:var(--mute);display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--mute);margin:4px 0 8px}
.legend span{display:flex;align-items:center;gap:4px}.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.back{background:none;border:0;color:var(--acc);font-size:16px;font-weight:700;padding:0;cursor:pointer}
.name{font-size:30px;font-weight:800;margin:14px 0 4px;text-align:center}
.meta{text-align:center;color:var(--mute);margin-bottom:16px}
.dc{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.dc-top{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.dc-van{background:#1F2937;color:#fff;border-radius:12px;padding:10px 14px;text-align:center;min-width:72px}.dc-van span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#cbd5e1}.dc-van b{display:block;font-size:34px;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.dc-nm{font-size:24px;font-weight:800}.dc-ch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.dc-ch span{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:14px}.dc-ch b{font-weight:800}
.dc-ch .gc{color:#fff;border-color:transparent}.dc-ld{font-size:14px;color:var(--mute);margin-top:10px;border-top:1px solid var(--line);padding-top:8px}.dc-ld b{color:var(--ink);font-size:16px}.dc-ld:empty{display:none}
.lg button.on{outline:3px solid var(--ink);outline-offset:2px}.grid .nb.dim{opacity:.3}
.grid .nb{flex-direction:column}.nb .sp{display:block;font-size:.78em;font-weight:600;opacity:.9;margin-top:2px}
#meBtn{display:none!important;width:100%;margin:6px 0 4px;background:var(--c);border-color:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;font-size:17px;min-height:52px}
.dnav{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;align-items:center}.dnav button{height:44px;border-radius:10px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;font-weight:800;cursor:pointer}.dnav button:disabled{opacity:.3}
.nb .hv{font-style:normal;position:absolute;top:3px;right:6px;font-size:13px}.grid .nb{position:relative}.dc-hv{margin-top:8px;background:#FEF3C7;color:#92400E;border:1px solid #F59E0B;border-radius:8px;padding:5px 10px;font-size:14px;font-weight:800}.dc-hv:empty{display:none}
.pkbox:empty{display:none}.pk-top{font-size:16px;margin-bottom:8px}.pk-top b{font-size:20px}.pk-sw{display:inline-block;background:#FEF3C7;color:#92400E;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:800}
.pk{display:grid;grid-template-columns:22px 1fr;gap:6px}.pk-cart{writing-mode:vertical-rl;transform:rotate(180deg);background:#374151;color:#fff;border-radius:6px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.pk-g{display:grid;gap:4px}.pc{border:2px solid;border-radius:8px;padding:4px 2px;text-align:center;font-size:11px;line-height:1.15;background:var(--card);position:relative;min-height:44px}.pc b{display:block;font-size:11px}.pc span{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pc i{position:absolute;top:1px;right:3px;font-style:normal;font-size:10px}.pc.empty{border:2px dashed var(--line);background:transparent}.pc.you{box-shadow:0 0 0 2px var(--ink)}
.pk-note{font-size:12px;color:var(--mute);margin-top:6px}
.nb-empty{border:2px dashed var(--c);border-radius:12px;min-height:48px;opacity:.45}.nb-empty.dim{opacity:.15}.gsep{grid-column:1/-1;height:6px}
.bg3{display:grid;grid-auto-flow:column;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.tc{border-radius:10px;padding:5px 6px;color:#fff;text-align:center;border:1px solid rgba(0,0,0,.15)}.tc.dk{color:#16212B}
.tr{display:grid;grid-template-columns:22px 1fr 26px;align-items:center}.ci{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.9);color:#16212B;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}.tc.dk .ci{background:#16212B;color:#fff}
.tn{font-size:22px;font-weight:900;line-height:1.05;letter-spacing:.02em}.pk{font-size:13px;font-weight:900}.tm{font-size:11px;opacity:.9}
.tof{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:3px}.tof span{background:rgba(0,0,0,.35);color:#fff;border-radius:5px;padding:0 5px;font-size:10.5px;font-weight:800}.tc.dk .tof span{background:rgba(0,0,0,.6)}.tof span.est{background:transparent;outline:1.5px dashed currentColor;color:inherit}
.lg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:8px 0 10px}.lg button{border:0;font-family:inherit;cursor:pointer;color:#fff;border-radius:8px;padding:7px 2px;text-align:center;font-size:12px;font-weight:800;white-space:nowrap}
.btns{display:grid;gap:12px}.two{grid-template-columns:1fr 1fr}
.btn{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;text-align:center;font-size:15px;color:var(--ink);font-family:inherit;width:100%}
.btn b{font-variant-numeric:tabular-nums;display:block;font-size:28px;margin-top:4px}
.btn.big b{font-size:34px;color:var(--acc)}
button.btn{cursor:pointer;border-color:var(--acc)}
button.btn:active{transform:scale(.98)}
.val{display:block;font-size:22px;font-weight:800;margin-top:4px;color:var(--acc)}
dialog{border:0;border-radius:18px;padding:20px;width:min(92vw,360px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 12px}
dialog input{width:100%;font-size:26px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.acts{display:flex;gap:10px;margin-top:14px}.acts button{flex:1;padding:12px;border-radius:12px;border:0;font-size:16px;font-weight:700}
.save{background:var(--acc);color:#111}.cancel{background:var(--line);color:var(--ink)}
.hidden{display:none!important}
.hint{text-align:center;color:var(--mute);margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nb{background:var(--card);border:2px solid var(--acc);border-radius:12px;padding:14px 4px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;min-height:56px;word-break:break-word}
.grid .nb{font-size:clamp(11px,3.2vw,15px);letter-spacing:-.01em;padding:8px 2px;min-height:48px;word-break:normal;overflow-wrap:normal;line-height:1.15;border-color:var(--c);background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center}
.ld{display:grid;gap:10px;margin-top:4px}
.ld h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:10px 0 0}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;font-size:11px;color:var(--mute);text-transform:uppercase}
.kp b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;text-transform:none}
.bl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bi{display:grid;grid-template-columns:28px 1fr 1.3fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bi:first-child{border-top:0}
.bi .n{color:var(--mute);font-size:12px}.bi .z{font-weight:700}.bi .p{font-weight:700}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.ofg{display:flex;flex-wrap:wrap;gap:6px}
.of{background:#6b7280;color:#fff;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.of small{font-weight:500;opacity:.85;margin-left:4px}
.stt{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;color:var(--ink);font-weight:700;cursor:pointer;margin-bottom:10px;text-align:left}
.stt span{float:right;color:var(--acc)}
.nb:active{transform:scale(.97)}
.dc2{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:stretch}
.dc-van2{background:#1F2937;border-radius:12px;color:#fff;display:flex;flex-direction:column;overflow:hidden}
.dc-van2>div{text-align:center;padding:6px 4px}.dc-van2 .v1{padding:10px 4px 8px}.dc-van2 .v2{border-top:1px solid rgba(255,255,255,.15);display:flex;align-items:baseline;justify-content:center;gap:6px;flex:1;align-items:center}
.dc-van2 span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#cbd5e1}.dc-van2 .v2 span{display:inline;font-weight:800}
.dc-van2 b{display:block;font-size:34px;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}.dc-van2 .v3{border-top:1px solid rgba(255,255,255,.15);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px}.dc-van2 .v3 span{font-size:10.5px}.dc-van2 .v2 b{display:inline;font-size:24px}
.dc-r{display:flex;flex-direction:column;gap:8px;min-width:0}
.dc-nm2{font-size:clamp(28px,9vw,40px);font-weight:900;text-align:center;line-height:1.05;overflow-wrap:anywhere}
.dc-ch2{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.dc-ch2 span{border-radius:20px;padding:4px 12px;font-size:15px;color:#fff}.dc-ch2 b{font-weight:800}
.dc-rt{text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:6px;font-size:16px}.dc-rt b{color:var(--acc);font-size:22px;font-weight:900;margin-left:4px}
.dc-ld2{font-size:13px;color:var(--mute);text-align:center;line-height:1.35}.dc-ld2 b{color:var(--ink);font-size:15px}.dc-ld2:empty{display:none}

#rows.six .nb{font-size:clamp(15px,4.6vw,24px);font-weight:900;line-height:1.05;padding:6px 2px;min-height:96px;width:100%;overflow-wrap:anywhere;border-radius:9px;letter-spacing:-.02em}#rows.six .nb .sp{font-size:.55em;margin-top:4px}#rows.six .nb .live{font-size:16px;left:2px}#rows.six .nb .hv{font-size:10px;right:3px}
.tc{cursor:pointer;transition:filter .2s,opacity .2s;-webkit-tap-highlight-color:transparent}.nb .live{position:absolute;top:-2px;left:4px;font-size:22px;line-height:1;color:#FDE047;text-shadow:0 0 3px #000,0 0 1px #000}.nb .lp{display:block;font-size:.72em;font-weight:900;background:rgba(0,0,0,.35);border-radius:6px;padding:0 4px;margin-top:2px}
.tc.off{filter:grayscale(1);opacity:.35}.tc.off .tn{text-decoration:line-through}
.rp{grid-column:1/-1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}.rp-t{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:6px}.rp-t b{color:var(--ink);font-size:16px}.rp-b{height:16px;background:var(--line);border-radius:8px;overflow:hidden}.rp-f{height:100%;background:linear-gradient(90deg,#16A34A,#22C55E);border-radius:8px;transition:width .4s}.rp-n{font-size:11px;color:var(--mute);margin-top:5px;text-align:center}

#rows .nb,#rows.six .nb{padding:3px 3px;line-height:1;letter-spacing:-.01em;overflow-wrap:normal}
#rows .nb .nm{display:block;max-width:100%;font-weight:900;line-height:1.02;overflow-wrap:normal;word-break:keep-all}
#rows .nb .sp,#rows.six .nb .sp{position:absolute;left:0;right:0;bottom:5px;font-size:12px;margin:0;line-height:1;text-align:center}#rows .nb,#rows.six .nb{padding-bottom:20px}
</style>

  o.addEventListener('click',function(e){if(e.target===o){close();return}var fu=e.target.dataset&&e.target.dataset.fu;if(fu){set(drv.n,'fuel',fu);render();return}
    if(e.target.closest&&e.target.closest('#tsLk')){if(get(drv.n,'inLock')!=='1'&&!get(drv.n,'in'))set(drv.n,'in',B());set(drv.n,'inLock',get(drv.n,'inLock')==='1'?'':'1');render();return}
    if(e.target.closest&&e.target.closest('#tsIn')){if(get(drv.n,'inLock')==='1'){var k=document.getElementById('tsLk');k.classList.add('shake');setTimeout(function(){k.classList.remove('shake')},500);return}openPick();return}
    if(e.target.id==='tsMType'){miOpen=true;miNote='';render();var i=document.getElementById('tsMIn');if(i){i.focus();i.select()}return}
    var lb=e.target.closest&&e.target.closest('#tsLunch');if(lb){lunchOpen=!lunchOpen;render();return}

    var ss=e.target.closest&&e.target.closest('[data-ss]');if(ss&&!get(drv.n,'signed')){var k=+ss.dataset.ss;if(k===window.tsStep){if(k<3){window.tsStep=k+1}else{window.tsStep=0;var _d=new Date();set(drv.n,'out',('0'+_d.getHours()).slice(-2)+':'+('0'+_d.getMinutes()).slice(-2));set(drv.n,'signed',String(_d.getTime()))}render()}}})}

  if(get(drv.n,'fuel')==null)set(drv.n,'fuel','no');
  if(!get(drv.n,'in'))set(drv.n,'in',B());
  render()};

<script>
(function(){
function rowsFor(day){return parse(DAYS[day].rows).filter(function(d){return d.n}).map(function(d){var b=String(d.b||'').trim();return {b:b,num:/^\d+$/.test(b)?+b:Infinity,n:d.n}})
  .sort(function(a,c){return a.num-c.num||a.n.localeCompare(c.n)})}
function pdfText(s){return String(s).replace(/[^\x20-\x7E]/g,function(c){return {'—':'-','–':'-','·':'-','’':"'"}[c]||''}).replace(/([\\()])/g,'\\$1')}
function makePdf(title,lines){
  var W=612,H=792,M=54,lh=17,colW=(W-2*M)/2,perCol=Math.floor((H-2*M-50)/lh),perPage=perCol*2,pages=[];
  for(var i=0;i<Math.max(lines.length,1);i+=perPage)pages.push(lines.slice(i,i+perPage));
  var objs=[],add=function(s){objs.push(s);return objs.length};
  var font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'),bold=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
  var pagesId=objs.length+1;objs.push(null);var kids=[];
  pages.forEach(function(pl,pi){var c='BT /F2 18 Tf '+M+' '+(H-M)+' Td ('+pdfText(title)+') Tj ET\n';
    if(pages.length>1)c+='BT /F1 10 Tf '+(W-M-60)+' '+(H-M)+' Td (Page '+(pi+1)+' of '+pages.length+') Tj ET\n';
    c+='0.6 G '+M+' '+(H-M-12)+' m '+(W-M)+' '+(H-M-12)+' l S 0 G\n';
    pl.forEach(function(L,k){var col=Math.floor(k/perCol),row=k%perCol,x=M+col*colW,y=H-M-40-row*lh;
      c+='BT /F2 13 Tf '+x+' '+y+' Td ('+pdfText(L[0])+') Tj ET\nBT /F1 13 Tf '+(x+34)+' '+y+' Td ('+pdfText(L[1])+') Tj ET\n'});
    var cs=add('<< /Length '+c.length+' >>\nstream\n'+c+'endstream');
    kids.push(add('<< /Type /Page /Parent '+pagesId+' 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 '+font+' 0 R /F2 '+bold+' 0 R >> >> /Contents '+cs+' 0 R >>'))});
  objs[pagesId-1]='<< /Type /Pages /Kids ['+kids.map(function(k){return k+' 0 R'}).join(' ')+'] /Count '+kids.length+' >>';
  var cat=add('<< /Type /Catalog /Pages '+pagesId+' 0 R >>');
  var out='%PDF-1.4\n',offs=[];objs.forEach(function(o,i){offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});
  var x=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(function(o){return String(o).padStart(10,'0')+' 00000 n \n'}).join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root '+cat+' 0 R >>\nstartxref\n'+x+'\n%%EOF';
  return new Blob([out],{type:'application/pdf'})}
function e3(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
window.makePhonePdf=function(day){var R=rowsFor(day),lbl=(DAYS[day].label||day).split(' · ')[0];
  return {blob:makePdf('Phone List - '+lbl,R.map(function(r){return [(r.b||'--')+' -',r.n]})),rows:R,label:lbl}};
window.openPhoneList=function(){var day=cur,P=makePhonePdf(day),url=URL.createObjectURL(P.blob),fname='Phone-List-'+day+'.pdf';
  var o=document.getElementById('plOv');if(o)o.remove();o=document.createElement('div');o.id='plOv';
  o.innerHTML='<div class="pl-top"><button id="plX" style="background:var(--line);color:var(--ink)">‹ Back</button><a id="plPdf" href="'+url+'" target="_blank" download="'+fname+'" style="margin-left:auto;background:#DC2626;color:#fff;font-weight:800;border-radius:10px;padding:9px 12px;text-decoration:none">⬇️ Download PDF</a></div>'+
   '<h2>Sorted Phone List</h2><div class="pl-sub">'+e3(P.label)+' · '+P.rows.length+' drivers · phone / bag number – driver</div><div class="pl-l" style="--rows:'+Math.ceil(P.rows.length/6)+'">'+
   P.rows.map(function(r){return '<div><b>'+e3(r.b||'—')+'</b>'+e3(r.n)+'</div>'}).join('')+'</div>';
  document.body.appendChild(o);o.querySelector('#plX').onclick=function(){o.remove();URL.revokeObjectURL(url)};
  o.querySelector('#plPdf').onclick=function(ev){if(!(window.claude&&window.claude.use))return;ev.preventDefault();var a=this;
    window.claude.use('downloads').then(function(d){if(!d){window.open(url,'_blank');return}return d.save({filename:fname,data:P.blob})}).catch(function(){})}};
new MutationObserver(function(){var b=document.getElementById('dspLog');if(!b)return;var t=b.querySelector('.dl-top');if(!t||t.querySelector('.dl-pl'))return;var a=document.createElement('button');a.className='dl-pl';a.textContent='📱 Sorted Phone List';a.style.cssText='background:#2563EB;color:#fff;font-weight:800;border:0;border-radius:10px;padding:8px 12px;cursor:pointer';a.onclick=function(){window.openPhoneList()};t.appendChild(a)}).observe(document.body,{childList:true,subtree:true});
})();
</script><script>
// layouts: list (num - name on one line) or tile (num above name)
window.makePhonePdf2=function(day,cols,mode){
  var R=parse(DAYS[day].rows).filter(function(d){return d.n}).map(function(d){var b=String(d.b||'').trim();return {b:b||'--',num:/^\d+$/.test(b)?+b:Infinity,n:d.n.replace(/[’]/g,"'")}}).sort(function(a,c){return a.num-c.num||a.n.localeCompare(c.n)});
  var lbl=(DAYS[day].label||day).split(' · ')[0].replace(/, \d{4}$/,'');
  var W=360,H=780,M=10,top=34,rows=Math.ceil(R.length/cols),colW=(W-2*M)/cols,rowH=(H-top-M)/rows;
  var cv=document.createElement('canvas').getContext('2d');function w(t,f,b){cv.font=(b?'bold ':'')+f+'px Helvetica, Arial';return cv.measureText(t).width}
  var fbig=0,fs;
  if(mode==='tile'){
    var maxNum=R.reduce(function(m,r){return w(r.b,1,true)>w(m,1,true)?r.b:m},'0');
    fbig=Math.floor(Math.min((colW-8)/w(maxNum,1,true),rowH*0.42)*10)/10;
    var room=rowH-fbig*1.05-8;
    var fits=R.map(function(r){var ws=r.n.split(' '),two=ws.length>1?[ws[0],ws.slice(1).join(' ')]:null;
      var one=Math.min((colW-6)/w(r.n,1,false),room/1.2),dbl=two?Math.min((colW-6)/Math.max(w(two[0],1,false),w(two[1],1,false)),room/2.3):0;return Math.max(one,dbl)});
    var so=fits.slice().sort(function(a,b){return a-b});fs=Math.floor(so[Math.min(2,so.length-1)]*10)/10;
    R.forEach(function(r,i){r.f=Math.min(fs,Math.floor(fits[i]*10)/10);var ws=r.n.split(' ');r.wrap=w(r.n,r.f,false)>colW-6&&ws.length>1;
      if(r.wrap){var two=[ws[0],ws.slice(1).join(' ')];var mx=Math.max(w(two[0],1,false),w(two[1],1,false));r.f=Math.min(r.f,Math.floor((colW-6)/mx*10)/10)}else r.f=Math.min(r.f,Math.floor(Math.min((colW-6)/w(r.n,1,false),room/1.2)*10)/10)});
  }else{
    var fits=R.map(function(r){return Math.min((colW-6)/(w(r.b+' - ',1,true)+w(r.n,1,false)),rowH*0.62)});
    var so=fits.slice().sort(function(a,b){return a-b});fs=Math.floor(so[Math.min(2,so.length-1)]*10)/10;
    R.forEach(function(r,i){r.f=Math.min(fs,Math.floor(fits[i]*10)/10)});
  }
  var c='BT /F2 15 Tf '+M+' '+(H-22)+' Td (Phone List - '+lbl+') Tj ET\n0.6 G '+M+' '+(H-29)+' m '+(W-M)+' '+(H-29)+' l S 0 G\n';
  R.forEach(function(r,k){var col=k%cols,row=Math.floor(k/cols),x=M+col*colW+3,y0=H-top-row*rowH;
    if(col>0)c+='0.85 G '+(M+col*colW)+' '+(H-top)+' m '+(M+col*colW)+' '+(H-top-rows*rowH)+' l S 0 G\n';
    c+='0.9 G '+(M+col*colW)+' '+(y0-rowH)+' m '+(M+(col+1)*colW)+' '+(y0-rowH)+' l S 0 G\n';
    if(mode==='tile'){var f=r.f,fb=fbig,ln=r.wrap?[r.n.split(' ')[0],r.n.split(' ').slice(1).join(' ')]:[r.n];c+='BT /F2 '+fb.toFixed(1)+' Tf '+x+' '+(y0-fb*0.95).toFixed(1)+' Td ('+r.b+') Tj ET\n';ln.forEach(function(t,j){c+='BT /F1 '+f+' Tf '+x+' '+(y0-fb*0.95-f*1.12*(j+1)).toFixed(1)+' Td ('+t+') Tj ET\n'})}
    else{var f=r.f,y=(y0-rowH/2-f*0.35).toFixed(1),nw=w(r.b+' - ',f,true);c+='BT /F2 '+f+' Tf '+x+' '+y+' Td ('+r.b+' -) Tj ET\nBT /F1 '+f+' Tf '+(x+nw).toFixed(1)+' '+y+' Td ('+r.n+') Tj ET\n'}});
  var o=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>','<< /Length '+c.length+' >>\nstream\n'+c+'endstream'];
  var out='%PDF-1.4\n',offs=[];o.forEach(function(s,i){offs.push(out.length);out+=(i+1)+' 0 obj\n'+s+'\nendobj\n'});var x=out.length;
  out+='xref\n0 7\n0000000000 65535 f \n'+offs.map(function(v){return String(v).padStart(10,'0')+' 00000 n \n'}).join('')+'trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
  return {pdf:out,fs:fs}};

window.makePhonePdf=function(day){var r=makePhonePdf2(day,6,'tile'),R=parse(DAYS[day].rows).filter(function(d){return d.n}).map(function(d){var b=String(d.b||'').trim();return {b:b,num:/^\d+$/.test(b)?+b:Infinity,n:d.n}}).sort(function(a,c){return a.num-c.num||a.n.localeCompare(c.n)});
  var bytes=new Uint8Array(r.pdf.length);for(var i=0;i<r.pdf.length;i++)bytes[i]=r.pdf.charCodeAt(i)&255;
  return {blob:new Blob([bytes],{type:'application/pdf'}),rows:R,label:(DAYS[day].label||day).split(' · ')[0]}};
