name: Ingest station PDFs

# Runs when the Gmail script drops the driver list / pick sheet PDFs into inbox/
on:
  push:
    branches: [ main ]
    paths: [ 'inbox/**' ]
  workflow_dispatch:

concurrency: { group: ingest, cancel-in-progress: false }

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}   # pushing with the PAT re-triggers the Pages deploy
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && pip install -q pillow
      - name: Read PDFs and update the board
        run: |
          ls inbox/*.pdf >/dev/null 2>&1 || { echo "No PDFs left (already handled)"; exit 0; }
          python3 tools/ingest.py inbox/*.pdf
          node tools/update.js
          git rm -q inbox/*.pdf
      - name: Commit
        run: |
          git config user.name "station-board-bot"
          git config user.email "mwillard0927-ctrl@users.noreply.github.com"
          git add -A index.html archive.js pick data inbox
          ls inbox/*.pdf >/dev/null 2>&1; git commit -qm "Auto: station sheets $(date -u +%F)" || exit 0
          git pull -q --rebase && git push -q
