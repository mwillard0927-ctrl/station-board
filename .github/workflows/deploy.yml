name: Deploy Station Driver Board to GitHub Pages

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [update_app]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: .
          force_orphan: true
